# Not tuned. The FP8 profile's batch 48 needed ~5.2 GiB above its 34.9 GiB of weights; the activations are
# BF16 in both, so 67.0 + ~6 GiB fits an 80 GB card.
batch_size: 48
tuning_batch_sizes: [8, 16, 32, 48, 64]
tuning_images: 804
