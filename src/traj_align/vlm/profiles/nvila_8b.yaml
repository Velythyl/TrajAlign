# NVILA 8B (NVIDIA, arXiv:2412.04468): ReMEmbR's own captioner family, added as
# a regular profile so the ReMEmbR baseline arm and a Qwen3-VL fairness arm
# differ by one `model_profile` line.
#
# `-hf` is NVIDIA's transformers-format export, but NVILA is *not* a native
# transformers architecture (no `nvila` model type in transformers 5.14.1):
# `config.json` maps AutoModelForImageTextToText/AutoProcessor onto
# `modeling_nvila.py` / `processing_nvila.py` in the repo, so this needs
# `trust_remote_code`. The revision pin is what makes that acceptable -- the
# remote code executed is exactly the commit below. Verified on 2026-09-27 on an
# L40S through `captioning_api.load_model_and_processor` and
# `generate_conversations`: loads in bf16 (~17 GB of weights), captions a
# Replica frame in ~5-8 s at ~200 tokens.
id: Efficient-Large-Model/NVILA-8B-hf
revision: e722ed6889396b54ff37a10fcfeabf8c2df3c935
# **1, and it is a fidelity bound, not a tuning result.** `processing_nvila.py`
# preprocesses a *call* with one image through NVILA's dynamic-S2 tiling
# (448/896/1344 scales, up to 12 tiles, `block_sizes`), but a call with several
# images -- which is what the service's batcher makes of N single-image
# conversations -- takes its multi-image branch: one 448 px tile and 256 tokens
# per image, no tiling. The captions measurably differ (same two Replica
# frames, batch of 1 vs 2). Width 1 keeps every frame on the single-image path
# NVILA was trained and evaluated with. It costs throughput: generation is
# serial on the card.
batch_size: 1
tuning_batch_sizes: [1]
tuning_images: 804
trust_remote_code: true
attn_implementation: sdpa
# The remote processor only accepts decoded images; see
# `captioning_api.IMAGE_INPUTS`.
image_input: pil
# `max_pixels` (sent by every `captioning_*` arm) is accepted and ignored by
# NVILAProcessor, whose resolution is fixed by the S2 tiling above. It still
# enters the caption cache key, which is harmless.
processor_kwargs: {}
